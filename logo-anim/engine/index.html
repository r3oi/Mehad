<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Logo Animation</title>
<style>
  html,body{margin:0;background:#1b1d20;color:#ddd;font:13px system-ui,sans-serif}
  canvas{display:block;max-width:100vw;max-height:88vh;margin:0 auto}
  .ui{display:flex;gap:10px;align-items:center;padding:8px 14px}
  body.render .ui{display:none}
  body.render canvas{max-width:none;max-height:none}
  input[type=range]{flex:1}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="ui"><button id="play">play</button><input id="scrub" type="range" min="0" value="0"><span id="tc"></span></div>
<link rel="stylesheet" href="fonts/fonts.css">
<script src="core.js"></script>
<script src="logos.js"></script>
<script src="fx.js"></script>
<script>
(async () => {
  const brand = QS.get("brand") || "mehad";
  await new Promise((res, rej) => { const s = document.createElement("script"); s.src = `brands/${brand}.js`; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
  try { await BRAND_DEF.load(); BRAND = BRAND_DEF; window.READY = true; } catch (e) { window.BOOT_ERROR = String(e); throw e; }
  if (QS.has("render")) { document.body.classList.add("render"); return; }
  const scrub = document.getElementById("scrub"), tc = document.getElementById("tc"); scrub.max = FRAMES() - 1;
  const show = n => { renderFrame(n); tc.textContent = `${(n / FPS).toFixed(2)}s  f${n}`; };
  scrub.oninput = () => show(+scrub.value); show(+(QS.get("f") || 0));
  let playing = false;
  document.getElementById("play").onclick = () => {
    playing = !playing; if (!playing) return;
    const t0 = performance.now() - scrub.value / FPS * 1000;
    const tick = () => { if (!playing) return; const n = Math.floor((performance.now() - t0) / 1000 * FPS) % FRAMES(); scrub.value = n; show(n); requestAnimationFrame(tick); };
    tick();
  };
})();
</script>
</body>
</html>
