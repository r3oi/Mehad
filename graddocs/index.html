<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GradDocs — Graduation Project Documentation Builder</title>
  <meta name="description" content="Create and maintain figures, tables, chapters, acronyms and auto-numbered lists for your graduation project report.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { var p = JSON.parse(localStorage.getItem('graddocs:prefs') || '{}'); if (p.theme === 'dark' || p.theme === 'light') document.documentElement.dataset.theme = p.theme; if (p.lang === 'ar') { document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl'; } } catch (e) {}
  </script>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/views.css">
  <link rel="stylesheet" href="styles/editor.css">
  <link rel="stylesheet" href="styles/structure.css">
  <link rel="stylesheet" href="styles/tables.css">
  <link rel="stylesheet" href="styles/acronyms.css">
  <link rel="stylesheet" href="styles/export.css">
  <link rel="stylesheet" href="styles/preview.css">
  <link rel="stylesheet" href="styles/print.css" media="print">
</head>
<body>
  <div id="root"></div>
  <div id="boot" style="position:fixed;inset:0;display:grid;place-items:center;font:500 14px system-ui;color:#667085">Loading GradDocs…</div>
  <noscript>GradDocs needs JavaScript enabled.</noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
