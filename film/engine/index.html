<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>خيطٌ واحد · النسخة الأولى</title>
<link rel="stylesheet" href="fonts/local.css">
<style>
  html,body{margin:0;background:#000;color:#E8F1EF;font-family:Cairo,sans-serif}
  canvas{display:block;width:100vw;height:auto;max-width:100%}
  body.render canvas{width:1920px;height:1080px}
  .ui{display:flex;gap:10px;align-items:center;padding:10px 14px;direction:ltr}
  body.render .ui{display:none}
  input[type=range]{flex:1}
  button{font:inherit;background:#0D2429;color:#E8F1EF;border:1px solid #28505A;border-radius:6px;padding:4px 12px;cursor:pointer}
  #tc{font-family:"IBM Plex Mono",monospace;font-size:13px;min-width:120px}
</style>
</head>
<body>
<canvas id="cv" width="1920" height="1080"></canvas>
<div class="ui"><button id="play">▶</button><input id="scrub" type="range" min="0" max="89.5" step="0.04" value="0"><span id="tc">00:00.00</span></div>
<script src="film.js"></script>
</body>
</html>
